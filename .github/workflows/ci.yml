name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
  postgres:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env: { POSTGRES_PASSWORD: memhub, POSTGRES_DB: memhub }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx vitest run tests/hub
        env: { TEST_DATABASE_URL: 'postgres://postgres@localhost:5432/memhub', PGPASSWORD: memhub }
