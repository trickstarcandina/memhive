name: ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
    inputs:
      nightly:
        description: 'Shuffle test order (VITEST_SHUFFLE=1) to find order-dependent tests'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      VITEST_SHUFFLE: ${{ inputs.nightly && '1' || '' }}
    defaults:
      run:
        # One POSIX shell everywhere; Git Bash on Windows.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # the built bundle in real processes (hooks, detached daemon, MCP stdio); skipped by `npm test` only without a build
      - run: npx vitest run tests/e2e

      # Installs the packed tarball the way a user would, so a broken `files` list, bin path or
      # native prebuild for this platform fails here instead of after publishing.
      - name: smoke test the packed tarball
        run: |
          npm pack
          node scripts/check-pack.mjs memhive-*.tgz
          npm install -g --prefix "$RUNNER_TEMP/p" ./memhive-*.tgz
          if [ "$RUNNER_OS" = Windows ]; then bin="$RUNNER_TEMP/p/memhive.cmd"; else bin="$RUNNER_TEMP/p/bin/memhive"; fi
          # A throwaway home: the smoke run must never see the runner's real config.
          export MEMHIVE_HOME="$RUNNER_TEMP/h" HOME="$RUNNER_TEMP/h"
          "$bin" --version
          "$bin" --help

  postgres:
    runs-on: ubuntu-latest
    env:
      VITEST_SHUFFLE: ${{ inputs.nightly && '1' || '' }}
    services:
      db:
        image: pgvector/pgvector:pg17@sha256:7d0a41464797aeb9862dfdc0bbf1526b82cfd324cdd8036df19e3545f4a9ccb8
        env: { POSTGRES_PASSWORD: memhive, POSTGRES_DB: memhive }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx vitest run tests/hub tests/sync
        env: { TEST_DATABASE_URL: 'postgres://postgres@localhost:5432/memhive', PGPASSWORD: memhive }
      # Coverage of the whole suite with Postgres; reported, not gated.
      - run: npm run build
      - name: coverage
        id: coverage
        run: |
          npm run test:coverage | tee coverage.txt
          summary=$(sed -n '/Coverage summary/,/^=*$/p' coverage.txt | grep -E 'Statements|Branches|Functions|Lines')
          { echo 'summary<<EOF'; echo "$summary"; echo EOF; } >> "$GITHUB_OUTPUT"
          { echo '### Coverage'; echo '```'; echo "$summary"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
        env: { TEST_DATABASE_URL: 'postgres://postgres@localhost:5432/memhive', PGPASSWORD: memhive }
