# Redraws the npm downloads chart for the README every day.
#
# The images live on the `stats` branch (one commit, overwritten each run), not on `main`:
# no automated commits in main's history, and no clash with branch protection.
# The README embeds them from raw.githubusercontent.com/<repo>/stats/.
#
# This is the only job allowed to write to the repo, so it does not run `npm ci`:
# the script has no dependencies and only reads registry.npmjs.org and api.npmjs.org.
name: stats

on:
  schedule:
    # Daily at 04:37 UTC; npm publishes the previous day's numbers in the early UTC morning.
    - cron: '37 4 * * *'
  # Also run when the workflow or the script lands on main, so the first merge creates the
  # `stats` branch instead of leaving the README with broken images until the next schedule.
  push:
    branches: [main]
    paths:
      - .github/workflows/stats.yml
      - scripts/download-chart.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  downloads-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # pushes the `stats` branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is only handed to the push step below, never left in .git/config.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: node scripts/download-chart.mjs stats-out

      - name: push to the stats branch
        working-directory: stats-out
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          git init -q -b stats
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -q -m "stats: $(date -u +%F)"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" stats
